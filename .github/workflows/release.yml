# 打 tag (v0.1.0) 时经 GoReleaser 发版 (配置见 .goreleaser.yaml, 混合模式):
#   goreleaser: 双架构编译 + 便携 zip + checksums.txt + GitHub Release 创建/上传
#   Makefile:   NSIS 安装器 (goreleaser before hook 调 make installer x2,
#               定制 jvm.nsi goreleaser 模板覆盖不了, 保留原产线)
# 资产:
#   jvm-windows-amd64-setup.exe   双击安装器 (给新用户)
#   jvm-windows-arm64-setup.exe   ARM64 双击安装器 (stub 为 x86, 释放 ARM64 原生 jvm.exe)
#   jvm-windows-amd64.zip         便携版 (供 jvm upgrade 精确匹配拉取)
#   jvm-windows-arm64.zip         ARM64 便携版 (ARM64 版 jvm 自更新拉这个)
#   checksums.txt                 GNU sha256sum 文本格式 (只含两个 zip, upgrade/install.ps1 消费)
#   install.ps1                   一行安装脚本
# 单测 gate 在 goreleaser before hooks (go vet + go test), 红则中止不发版。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # goreleaser 创建 release / 上传 asset; gh release edit 覆盖 body

jobs:
  goreleaser:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 完整历史: goreleaser 需 tag 推导版本号与默认 changelog 的提交范围
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install NSIS
        shell: pwsh
        # choco 装 NSIS 到 C:\Program Files (x86)\NSIS, 但不会刷新当前 job 的 PATH,
        # 所以 goreleaser before hook 里跑 make installer 的 makensis 会 "command not found"。
        # NSIS 的 makensis.exe 直接在该目录下 (无版本子目录), 故直接写这个路径。
        run: |
          choco install nsis -y --no-progress
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found under $nsisDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Write-Host "Added to GITHUB_PATH: $nsisDir"

      - name: Verify makensis
        # 失败在这里会给出清晰错误, 而不是埋在 goreleaser before hook 里
        shell: pwsh
        run: makensis /VERSION

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # goreleaser CLI 版本显式固定 (与本地 snapshot 验证版本一致),
          # 防止 latest 漂移破坏产线; 升级前先本地跑通 snapshot
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Override release notes from CHANGELOG.md
        # goreleaser OSS 版的 release.header 不支持从文件加载 (from_file 是 Pro
        # 专属), 故 Release body 在这里覆盖: goreleaser before hook 里的
        # scripts/gen-release-header.sh 已把 CHANGELOG.md 当前版本段落抽到
        # dist/release-header.md。文件非空 -> 覆盖 body; 空 -> 保留 goreleaser
        # 默认 changelog body (与旧管线 CHANGELOG 抽取/回退行为等价)。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s dist/release-header.md ]; then
            echo "覆盖 Release body (CHANGELOG.md [$GITHUB_REF_NAME] 段落)"
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/release-header.md
          else
            echo "CHANGELOG.md 未抽取到段落, 保留 goreleaser 默认 changelog body"
          fi
